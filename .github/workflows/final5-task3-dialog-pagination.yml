name: FINAL5 Task3 Dialog Pagination

on:
  pull_request:
    paths:
      - 'ops/final5_task3_dialog_pagination.py'
      - 'tests/test_final5_task3_dialog_pagination.py'
      - '.github/workflows/final5-task3-dialog-pagination.yml'

permissions:
  contents: read

jobs:
  focused-dialog-pagination:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Compile focused candidate
        run: python -m py_compile ops/final5_task3_dialog_pagination.py tests/test_final5_task3_dialog_pagination.py
      - name: Run focused dialog continuation regressions
        run: python -m unittest tests.test_final5_task3_dialog_pagination -v
      - name: Current-tree secret scan
        if: always()
        run: python tools/secret_scan.py --mode current
      - name: No deploy guard
        if: always()
        run: |
          test ! -e .cpanel.yml
          test ! -e ops/ENABLE_HOSTIQ_AUTO_DEPLOY
