name: Hourly FINAL5 05 Acceptance Release Gate

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: telegram-bridge-hourly-final5-05
  cancel-in-progress: true

env:
  TARGET_PR: '9'

jobs:
  acceptance-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Resolve exact current PR 9 head
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          json="$(curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}")"
          sha="$(python -c 'import json,sys; d=json.load(sys.stdin); print(d["head"]["sha"])' <<<"$json")"
          test "${#sha}" -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact current candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install exact runtime dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock

      - name: Acceptance harness and candidate contracts
        run: |
          python -m unittest -v tests.test_acceptance_harness tests.test_acceptance_contracts tests.test_dev_a_candidate_contracts tests.test_dev_a_integration tests.test_dev_a_provenance

      - name: Validate unified Action schema
        run: python tools/build_action_openapi.py --validate-only

      - name: Validate truthful 67-criterion and route inventory
        run: |
          python - <<'PY'
          from ops.candidate_contracts import candidate_acceptance_coverage, integrated_api_inventory, validate_candidate_acceptance_coverage, validate_integrated_api_inventory
          coverage = candidate_acceptance_coverage()
          counts = validate_candidate_acceptance_coverage(coverage)
          inventory = integrated_api_inventory()
          validate_integrated_api_inventory(inventory)
          assert sum(counts.values()) == 67, counts
          assert len(inventory) == 19, len(inventory)
          print('FINAL5_ACCEPTANCE_INVENTORY_PASS', counts)
          PY

      - name: Current-tree secret scan
        if: always()
        run: python tools/secret_scan.py --mode current

      - name: Full-history secret scan
        if: always()
        run: python tools/secret_scan.py --mode history

      - name: Record exact tested identity
        if: always()
        run: |
          printf 'FINAL5-05 exact PR head: %s\n' '${{ steps.target.outputs.sha }}'
          test "$(git rev-parse HEAD)" = '${{ steps.target.outputs.sha }}'
