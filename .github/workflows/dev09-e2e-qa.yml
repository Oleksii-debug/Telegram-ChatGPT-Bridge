name: DEV09 Independent QA

on:
  pull_request:
    branches:
      - work3/integration-release-candidate

permissions:
  contents: read

jobs:
  dev09-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact DEV09 head with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Compile DEV09 QA-only tooling
        run: >-
          python -m py_compile
          ops/dev09_qa_probe.py
          tests/test_dev09_qa_probe.py
      - name: Exact-parent independent QA probes
        env:
          DEV09_EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python -m unittest tests.test_dev09_qa_probe -v
      - name: Emit bounded canonical provenance classification
        run: python -m ops.dev09_qa_probe --provenance-probe
      - name: Emit bounded exact exported-suite diagnostic
        run: python -m ops.dev09_qa_probe --suite-probe
      - name: Emit bounded acceptance truth snapshot
        run: python -m ops.dev09_qa_probe
      - name: Complete cross-lane regression
        env:
          DEV09_SKIP_EXPENSIVE: '1'
        run: python -m unittest discover -s tests -v
      - name: Current-tree secret scan
        if: always()
        run: python tools/secret_scan.py --mode current
      - name: Full-history secret scan
        if: always()
        run: python tools/secret_scan.py --mode history
      - name: Preserve no-production-mutation boundary
        if: always()
        run: |
          test ! -e .cpanel.yml
          test ! -e ops/ENABLE_HOSTIQ_AUTO_DEPLOY
