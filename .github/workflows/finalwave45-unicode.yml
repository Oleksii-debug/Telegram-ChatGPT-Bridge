name: FINALWAVE45 Unicode Filename QA

on:
  push:
    branches:
      - finalwave26/45-unicode-filenames
  pull_request:
    branches:
      - work3/integration-release-candidate

permissions:
  contents: read

jobs:
  unicode-filename-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Compile Unicode filename surface
        run: >-
          python -m py_compile
          bridge/filenames.py
          bridge/archive.py
          bridge/models.py
          bridge/downloads.py
          bridge/storage.py
          bridge/validation.py
          ops/file_send_policy.py
          tests/test_finalwave45_unicode_filenames.py
      - name: Run FINALWAVE45 adversarial and adjacent regressions
        run: |
          python -m unittest -v \
            tests.test_finalwave45_unicode_filenames \
            tests.test_dev04_media_storage \
            tests.test_archive_security \
            tests.test_dev4_file_send_policy \
            tests.test_backend_read \
            tests.test_validation_security \
            tests.test_storage_downloads \
            tests.test_dev04_private_serving \
            tests.test_read_app
      - name: Validate unified ChatGPT Action schema offline
        run: python tools/build_action_openapi.py --validate-only
      - name: Current-tree secret scan
        if: always()
        run: python tools/secret_scan.py --mode current
      - name: Full-history secret scan
        if: always()
        run: python tools/secret_scan.py --mode history
      - name: Verify recovery and no-deploy markers
        if: always()
        run: |
          test -f RECOVERY_BASELINE.md
          grep -q 'DO NOT MERGE / DO NOT DEPLOY' RECOVERY_BASELINE.md
          test ! -e .cpanel.yml
          test ! -e ops/ENABLE_HOSTIQ_AUTO_DEPLOY
