name: FINALWAVE37 Rollback State Compatibility

on:
  pull_request:
    paths:
      - 'ops/finalwave37_rollback_state_compat.py'
      - 'tests/test_finalwave37_rollback_state_compat.py'
      - 'docs/FINALWAVE37_ROLLBACK_STATE_COMPAT.md'
      - '.github/workflows/finalwave37-rollback-state.yml'

permissions:
  contents: read

jobs:
  rollback-state-compat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Bind rollback evidence to immutable checked-out candidate
        id: checkout-binding
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_HEAD"
          actual_head="$(git rev-parse 'HEAD^{commit}')"
          test "$actual_head" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"
          EXPECTED_HEAD="$EXPECTED_HEAD" python - <<'PY'
          import os
          from pathlib import Path
          from ops.finalwave37_rollback_state_compat import derive_source_checkout_binding

          binding = derive_source_checkout_binding(Path.cwd())
          actual_head = binding["candidate_sha"]
          if actual_head != os.environ["EXPECTED_HEAD"]:
              raise SystemExit("rollback source binding does not match event candidate")
          print(f"ROLLBACK_SOURCE_HEAD={actual_head}")
          print(f"ROLLBACK_SOURCE_BINDING_SHA256={binding['source_binding_sha256']}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"candidate_sha={actual_head}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### FINALWAVE37 exact rollback candidate\n\n")
              summary.write(f"`{actual_head}`\n")
          PY
      - name: Compile rollback-state surface
        run: >-
          python -m py_compile
          ops/finalwave37_rollback_state_compat.py
          tests/test_finalwave37_rollback_state_compat.py
          bridge/storage.py
          bridge/runtime.py
          bridge/audit.py
          ops/write_safety.py
          ops/deploy_release.py
      - name: FINALWAVE-37 exact predecessor and forced-rollback matrix
        run: python -m unittest discover -s tests -p 'test_finalwave37_rollback_state_compat.py' -v
      - name: Adjacent files downloads writes rate session audit regressions
        run: |
          python -m unittest discover -s tests -p 'test_storage_downloads.py' -v
          python -m unittest discover -s tests -p 'test_dev04_media_storage.py' -v
          python -m unittest discover -s tests -p 'test_dev04_migration_concurrency.py' -v
          python -m unittest discover -s tests -p 'test_dev4_write_core.py' -v
          python -m unittest discover -s tests -p 'test_runtime_bootstrap.py' -v
          python -m unittest discover -s tests -p 'test_dev4_session_lock.py' -v
          python -m unittest discover -s tests -p 'test_dev07_audit_security.py' -v
          python -m unittest discover -s tests -p 'test_audit_round9.py' -v
      - name: Current-tree secret scan
        if: always()
        run: python tools/secret_scan.py --mode current
      - name: Full-history secret scan
        if: always()
        run: python tools/secret_scan.py --mode history
      - name: Recovery and no-autodeploy guards
        if: always()
        run: |
          test -f RECOVERY_BASELINE.md
          grep -q 'DO NOT MERGE / DO NOT DEPLOY' RECOVERY_BASELINE.md
          test ! -e .cpanel.yml
          test ! -e ops/ENABLE_HOSTIQ_AUTO_DEPLOY
