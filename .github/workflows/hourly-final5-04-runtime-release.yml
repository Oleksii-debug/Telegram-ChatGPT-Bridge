name: Hourly FINAL5 04 Runtime Release Nonlive

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: telegram-bridge-hourly-final5-04
  cancel-in-progress: true

env:
  TARGET_PR: '9'

jobs:
  runtime-release-nonlive:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Resolve exact current PR 9 head
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          json="$(curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}")"
          sha="$(python -c 'import json,sys; d=json.load(sys.stdin); print(d["head"]["sha"])' <<<"$json")"
          ref="$(python -c 'import json,sys; d=json.load(sys.stdin); print(d["head"]["ref"])' <<<"$json")"
          test "${#sha}" -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout exact current candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install exact runtime dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock

      - name: Fetch exact candidate branch ref for PREPARE binding
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${{ steps.target.outputs.ref }}:refs/remotes/origin/${{ steps.target.outputs.ref }}"
          test "$(git rev-parse "refs/remotes/origin/${{ steps.target.outputs.ref }}")" = '${{ steps.target.outputs.sha }}'

      - name: Run runtime, deployment, recovery and rollback families
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          rx = re.compile(r'(deploy|release|passenger|runtime|rollback|baseline|recovery|hostiq|wsgi|prepare)', re.I)
          files = [p for p in sorted(Path('tests').glob('test_*.py')) if rx.search(p.name)]
          if not files:
              raise SystemExit('No runtime/release tests selected')
          print(f'Selected {len(files)} runtime/release test files')
          for p in files:
              mod = p.with_suffix('').as_posix().replace('/', '.')
              subprocess.run([sys.executable, '-m', 'unittest', '-v', mod], check=True)
          PY

      - name: Real exact-head NONLIVE PREPARE
        run: |
          python tools/verify_release_prepare.py \
            --repo . \
            --sha '${{ steps.target.outputs.sha }}' \
            --approved-ref 'origin/${{ steps.target.outputs.ref }}'

      - name: Verify no deployment arming material
        if: always()
        run: |
          test ! -e .cpanel.yml
          test ! -e ops/ENABLE_HOSTIQ_AUTO_DEPLOY

      - name: Record exact tested identity
        if: always()
        run: |
          printf 'FINAL5-04 exact PR head: %s\n' '${{ steps.target.outputs.sha }}'
          test "$(git rev-parse HEAD)" = '${{ steps.target.outputs.sha }}'
