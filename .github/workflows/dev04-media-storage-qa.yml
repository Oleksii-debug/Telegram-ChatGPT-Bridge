name: DEV04 Media Storage QA

on:
  pull_request:

permissions:
  contents: read

jobs:
  dev04-media-storage-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Compile DEV04 media storage slice
        run: >-
          python -m py_compile
          bridge/filenames.py
          bridge/storage.py
          bridge/downloads.py
          bridge/archive.py
          bridge/file_access.py
          bridge/app.py
          tests/test_dev04_media_storage.py
          tests/test_dev04_private_serving.py
          tests/test_dev04_upload_handles.py
          tests/test_dev04_migration_concurrency.py
          tests/test_storage_downloads.py
          tests/test_archive_security.py
          tests/test_read_app.py
      - name: Run DEV04 media storage and private serving regressions
        run: |
          umask 077
          python -m unittest \
            tests.test_dev04_media_storage \
            tests.test_dev04_private_serving \
            tests.test_dev04_upload_handles \
            tests.test_dev04_migration_concurrency \
            tests.test_storage_downloads \
            tests.test_archive_security \
            tests.test_read_app -v
      - name: Recheck send-files private file compatibility
        run: |
          umask 077
          python -m unittest tests.test_dev4_file_send_policy -v
      - name: Recheck offline OpenAPI import surface
        run: python tools/build_action_openapi.py --validate-only
      - name: Current-tree secret scan
        if: always()
        run: python tools/secret_scan.py --mode current
      - name: Full-history secret scan
        if: always()
        run: python tools/secret_scan.py --mode history
      - name: Verify non-deploy safety markers
        if: always()
        run: |
          test -f RECOVERY_BASELINE.md
          grep -q 'DO NOT MERGE / DO NOT DEPLOY' RECOVERY_BASELINE.md
          test ! -e .cpanel.yml
          test ! -e ops/ENABLE_HOSTIQ_AUTO_DEPLOY
