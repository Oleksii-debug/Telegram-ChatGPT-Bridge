name: BURST01-15 Scale Bounds

on:
  pull_request:
    paths:
      - "bridge/audit.py"
      - "bridge/downloads.py"
      - "tests/test_burst01_15_scale_bounds.py"
      - ".github/workflows/burst01-15-scale.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scale-bounds:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout specialist candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          check-latest: false
      - name: Compile changed runtime and focused regressions
        run: python -m py_compile bridge/audit.py bridge/downloads.py tests/test_burst01_15_scale_bounds.py
      - name: Run BURST01-15 resource-bound regressions
        run: python -m unittest discover -s tests -p 'test_burst01_15_scale_bounds.py' -v
      - name: Run inherited media/download regressions
        run: |
          python -m unittest discover -s tests -p 'test_storage_downloads.py' -v
          python -m unittest discover -s tests -p 'test_dev04_media_storage.py' -v
      - name: Run inherited audit security regressions
        run: python -m unittest discover -s tests -p 'test_dev07_audit_security.py' -v
