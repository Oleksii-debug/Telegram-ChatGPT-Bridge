name: FINAL5 TASK2 Preparse B8 Composition

on:
  pull_request:
    paths:
      - 'bridge/preparse_rate_guard.py'
      - 'bridge/runtime_wsgi.py'
      - 'tests/test_final5_task2_preparse_b8_composition.py'
      - '.github/workflows/final5-task2-preparse-b8.yml'

permissions:
  contents: read

jobs:
  preparse-b8:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Compile changed boundary
        run: >-
          python -m py_compile
          bridge/preparse_rate_guard.py
          bridge/runtime_wsgi.py
          tests/test_final5_task2_preparse_b8_composition.py
      - name: Focused preparse B8 composition regressions
        run: python -m unittest tests.test_final5_task2_preparse_b8_composition -v
      - name: Adjacent auth parser and WSGI regressions
        run: >-
          python -m unittest
          tests.test_finalwave22_rate_limit_auth_failclosed
          tests.test_finalwave26_wsgi_guard_wiring
          tests.test_finalwave26_openapi_runtime_parity
          tests.test_finalwave46_request_parser_fuzz
          tests.test_finalwave46_request_parser_resilience
          -v
      - name: Current-tree secret scan
        if: always()
        run: python tools/secret_scan.py --mode current
      - name: Full-history secret scan
        if: always()
        run: python tools/secret_scan.py --mode history
      - name: Recovery and no-autodeploy guards
        if: always()
        run: |
          test -f RECOVERY_BASELINE.md
          grep -q 'DO NOT MERGE / DO NOT DEPLOY' RECOVERY_BASELINE.md
          test ! -e .cpanel.yml
          test ! -e ops/ENABLE_HOSTIQ_AUTO_DEPLOY
