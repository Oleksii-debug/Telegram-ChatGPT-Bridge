name: FINAL5 Task3 Dialog Pagination Current

on:
  pull_request:
    paths:
      - 'bridge/dialog_pagination.py'
      - 'bridge/runtime_wsgi.py'
      - 'tests/test_final5_task3_dialog_pagination_current.py'
      - '.github/workflows/final5-task3-dialog-pagination-current.yml'

permissions:
  contents: read

jobs:
  dialog-pagination:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Compile Task3 boundary
        run: >-
          python -m py_compile
          bridge/dialog_pagination.py
          bridge/runtime_wsgi.py
          tests/test_final5_task3_dialog_pagination_current.py
      - name: Focused dialog continuation regressions
        run: python -m unittest tests.test_final5_task3_dialog_pagination_current -v
      - name: Adjacent Telegram read/search regressions
        run: >-
          python -m unittest
          tests.test_swarm10_global_search_integration
          tests.test_dev03_read_hardening
          -v
      - name: Current-tree secret scan
        if: always()
        run: python tools/secret_scan.py --mode current
      - name: Full-history secret scan
        if: always()
        run: python tools/secret_scan.py --mode history
      - name: Recovery and no-autodeploy guards
        if: always()
        run: |
          test -f RECOVERY_BASELINE.md
          grep -q 'DO NOT MERGE / DO NOT DEPLOY' RECOVERY_BASELINE.md
          test ! -e .cpanel.yml
          test ! -e ops/ENABLE_HOSTIQ_AUTO_DEPLOY
