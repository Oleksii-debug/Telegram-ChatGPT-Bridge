name: FINAL10 A2 Read Search Acceptance

on:
  push:
    branches:
      - 'final10/a2-read-search-acceptance-cc808'
    paths:
      - 'tests/test_final10_a2_read_search_acceptance.py'
      - '.github/workflows/final10-a2-read-search-acceptance.yml'
  pull_request:
    paths:
      - 'tests/test_final10_a2_read_search_acceptance.py'
      - '.github/workflows/final10-a2-read-search-acceptance.yml'

permissions:
  contents: read

jobs:
  read-search-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact specialist head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Verify exact parent and QA-only diff
        shell: bash
        run: |
          set -euo pipefail
          parent='cc808a14740bad5e239ceec1592163c01182239c'
          git merge-base --is-ancestor "$parent" HEAD
          actual="$(git diff --name-only "$parent"..HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/final10-a2-read-search-acceptance.yml' \
            'tests/test_final10_a2_read_search_acceptance.py' | sort)"
          test "$actual" = "$expected"
      - name: Compile focused read/search boundary
        run: >-
          python -m py_compile
          bridge/backend.py
          bridge/dialog_pagination.py
          bridge/typed_dialog_identity.py
          bridge/validation.py
          tests/test_final10_a2_read_search_acceptance.py
          tests/test_swarm10_global_search_integration.py
      - name: Run focused restart and native global-search regressions
        run: >-
          python -m unittest
          tests.test_final10_a2_read_search_acceptance
          tests.test_swarm10_global_search_integration
          -v
      - name: Current-tree secret scan
        if: always()
        run: python tools/secret_scan.py --mode current
      - name: Confirm no deployment arming marker
        if: always()
        shell: bash
        run: |
          test ! -e .cpanel.yml
          test ! -e ops/ENABLE_HOSTIQ_AUTO_DEPLOY
