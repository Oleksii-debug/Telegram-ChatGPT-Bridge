name: DEV10 Accessibility Protocol

on:
  pull_request:
    paths:
      - 'ops/dev10_accessibility_protocol.py'
      - 'tests/test_dev10_accessibility_protocol.py'
      - 'docs/DEV10_ACCESSIBILITY_LIVE_E2E_PROTOCOL.md'
      - '.github/workflows/dev10-accessibility.yml'

permissions:
  contents: read

jobs:
  dev10-accessibility-protocol:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Compile DEV10 protocol and tests
        run: python -m py_compile ops/dev10_accessibility_protocol.py tests/test_dev10_accessibility_protocol.py
      - name: Run DEV10 protocol tests
        run: python -m unittest -v tests.test_dev10_accessibility_protocol
      - name: Current-tree secret scan
        if: ${{ always() }}
        run: python tools/secret_scan.py --mode current
