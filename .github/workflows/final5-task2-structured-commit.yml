name: FINAL5 TASK2 Structured Commit Receipt

on:
  pull_request:
    paths:
      - 'ops/structured_safe_write.py'
      - 'tests/test_final5_task2_structured_commit_receipt.py'
      - '.github/workflows/final5-task2-structured-commit.yml'

permissions:
  contents: read

jobs:
  structured-commit-receipt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact specialist head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Compile focused reliability surface
        run: >-
          python -m py_compile
          ops/write_safety.py
          ops/secure_write_store.py
          ops/structured_safe_write.py
          tests/test_final5_task2_structured_commit_receipt.py
          tests/test_dev4_write_core.py
      - name: Late-fault and replay adversarial regression
        run: python -m unittest tests.test_final5_task2_structured_commit_receipt -v
      - name: Adjacent canonical exactly-once regression
        run: python -m unittest tests.test_dev4_write_core -v
      - name: Current-tree secret scan
        if: always()
        run: python tools/secret_scan.py --mode current
      - name: Full-history secret scan
        if: always()
        run: python tools/secret_scan.py --mode history
      - name: No-autodeploy guard
        if: always()
        run: |
          test ! -e .cpanel.yml
          test ! -e ops/ENABLE_HOSTIQ_AUTO_DEPLOY
