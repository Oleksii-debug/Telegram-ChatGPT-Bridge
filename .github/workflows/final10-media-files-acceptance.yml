name: FINAL10 Media Files Acceptance

on:
  push:
    branches:
      - 'final10/media-files-acceptance-cc808'
    paths:
      - 'tests/test_final10_media_files_acceptance.py'
      - '.github/workflows/final10-media-files-acceptance.yml'
  pull_request:
    paths:
      - 'tests/test_final10_media_files_acceptance.py'
      - '.github/workflows/final10-media-files-acceptance.yml'

permissions:
  contents: read

jobs:
  media-files-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact specialist head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Verify exact parent and QA-only diff
        shell: bash
        run: |
          set -euo pipefail
          parent='cc808a14740bad5e239ceec1592163c01182239c'
          git merge-base --is-ancestor "$parent" HEAD
          actual="$(git diff --name-only "$parent"..HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/final10-media-files-acceptance.yml' \
            'tests/test_final10_media_files_acceptance.py' | sort)"
          test "$actual" = "$expected"
      - name: Compile focused media/files boundary
        run: >-
          python -m py_compile
          bridge/backend.py
          bridge/downloads.py
          bridge/storage.py
          bridge/archive.py
          bridge/file_access.py
          bridge/upload_snapshot.py
          tests/test_final10_media_files_acceptance.py
      - name: Run focused current-successor media/files acceptance
        run: python -m unittest tests.test_final10_media_files_acceptance -v
      - name: Current-tree secret scan
        if: always()
        run: python tools/secret_scan.py --mode current
      - name: Confirm no deployment arming marker
        if: always()
        shell: bash
        run: |
          test ! -e .cpanel.yml
          test ! -e ops/ENABLE_HOSTIQ_AUTO_DEPLOY
