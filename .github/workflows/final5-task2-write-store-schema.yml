name: FINAL5 TASK2 Write Store Schema Race

on:
  pull_request:
    paths:
      - 'ops/write_safety.py'
      - 'tests/test_final5_task2_write_store_schema_race.py'
      - 'tests/test_dev4_write_core.py'
      - '.github/workflows/final5-task2-write-store-schema.yml'

permissions:
  contents: read

jobs:
  write-store-schema-race:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Compile write store and regression
        run: python -m py_compile ops/write_safety.py tests/test_final5_task2_write_store_schema_race.py
      - name: Multiprocess schema bootstrap adversarial regression
        run: python -m unittest tests.test_final5_task2_write_store_schema_race -v
      - name: Adjacent exactly-once write core
        run: python -m unittest tests.test_dev4_write_core -v
      - name: Current-tree secret scan
        if: always()
        run: python tools/secret_scan.py --mode current
      - name: Full-history secret scan
        if: always()
        run: python tools/secret_scan.py --mode history
      - name: Recovery and no-autodeploy guards
        if: always()
        run: |
          test -f RECOVERY_BASELINE.md
          grep -q 'DO NOT MERGE / DO NOT DEPLOY' RECOVERY_BASELINE.md
          test ! -e .cpanel.yml
          test ! -e ops/ENABLE_HOSTIQ_AUTO_DEPLOY
