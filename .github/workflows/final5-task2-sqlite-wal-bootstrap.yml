name: FINAL5 Task2 SQLite WAL Bootstrap

on:
  pull_request:
    branches:
      - work3/integration-release-candidate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-wal-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Compile changed Python surfaces
        run: python -m py_compile bridge/storage.py tests/test_dev04_migration_concurrency.py tests/test_final5_task2_sqlite_wal_bootstrap.py
      - name: Focused SQLite WAL bootstrap regressions
        run: python -m unittest -v tests.test_dev04_migration_concurrency tests.test_final5_task2_sqlite_wal_bootstrap
      - name: Repeat fresh multiprocess bootstrap to detect flakiness
        run: |
          for attempt in $(seq 1 10); do
            python -m unittest -v tests.test_dev04_migration_concurrency.ConcurrentFileRegistryMigrationTests.test_four_workers_share_fresh_file_registry_bootstrap
          done
