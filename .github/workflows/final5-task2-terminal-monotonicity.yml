name: FINAL5 TASK2 Terminal Monotonicity

on:
  pull_request:
    branches:
      - work3/integration-release-candidate
    paths:
      - 'ops/final5_task2_terminal_guard.py'
      - 'tests/test_final5_task2_terminal_monotonicity.py'
      - '.github/workflows/final5-task2-terminal-monotonicity.yml'

permissions:
  contents: read

jobs:
  terminal-monotonicity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile focused files
        run: python -m py_compile ops/final5_task2_terminal_guard.py tests/test_final5_task2_terminal_monotonicity.py tests/test_dev4_write_core.py
      - name: Run focused terminal-state tests
        run: python -m unittest -v tests.test_final5_task2_terminal_monotonicity
      - name: Run adjacent canonical write-safety tests
        run: python -m unittest -v tests.test_dev4_write_core
      - name: Current-tree secret scan
        run: python ops/secret_scan.py --scope current
      - name: Full-history secret scan
        if: always()
        run: python ops/secret_scan.py --scope history
