name: FINAL5 TASK3 Global Continuation Guard R7

on:
  push:
    branches:
      - final5/task3-global-continuation-guard-r7
  pull_request:
    branches:
      - work3/integration-release-candidate
    paths:
      - bridge/final5_search_guard_r7.py
      - tests/test_final5_task3_search_guard_r7.py
      - .github/workflows/final5-task3-global-continuation-r7.yml

permissions:
  contents: read

jobs:
  task3-global-continuation-r7:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Compile focused candidate
        run: python -m py_compile bridge/final5_search_guard_r7.py tests/test_final5_task3_search_guard_r7.py
      - name: Run focused global continuation regressions
        run: python -m unittest -v tests.test_final5_task3_search_guard_r7
      - name: Current-tree secret scan
        run: python tools/secret_scan.py --mode current
      - name: Verify specialist overlay cannot arm deployment
        run: |
          test ! -e .cpanel.yml
          test ! -e ops/ENABLE_HOSTIQ_AUTO_DEPLOY
          test "${GITHUB_REF_NAME}" != "main"
