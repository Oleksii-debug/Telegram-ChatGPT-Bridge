name: FINAL5 Task3 Search R10

on:
  pull_request:
    paths:
      - 'bridge/final5_task3_search_r10.py'
      - 'tests/test_final5_task3_search_r10.py'
      - '.github/workflows/final5-task3-search-r10.yml'

permissions:
  contents: read

jobs:
  focused-search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Compile candidate and tests
        run: python -m py_compile bridge/final5_task3_search_r10.py tests/test_final5_task3_search_r10.py
      - name: Run focused Task3 regressions
        run: python -m unittest tests.test_final5_task3_search_r10 -v
      - name: Current-tree secret scan
        if: always()
        run: python tools/secret_scan.py --mode current
      - name: Deployment remains disarmed
        if: always()
        run: |
          test ! -e .cpanel.yml
          test ! -e ops/ENABLE_HOSTIQ_AUTO_DEPLOY
