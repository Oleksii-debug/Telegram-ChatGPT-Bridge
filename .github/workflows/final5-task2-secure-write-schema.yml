name: FINAL5 TASK2 Secure Write Schema

on:
  pull_request:
    paths:
      - 'ops/secure_write_store.py'
      - 'tests/test_final5_task2_secure_write_schema_adoption.py'
      - '.github/workflows/final5-task2-secure-write-schema.yml'

permissions:
  contents: read

jobs:
  secure-write-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Compile secure write state and regressions
        run: >-
          python -m py_compile
          ops/write_safety.py
          ops/secure_write_store.py
          ops/structured_safe_write.py
          tests/test_final5_task2_secure_write_schema_adoption.py
          tests/test_finalwave38_runtime_composition.py
      - name: Secure schema adoption adversarial matrix
        run: python -m unittest -v tests.test_final5_task2_secure_write_schema_adoption
      - name: Adjacent production write composition regression
        run: python -m unittest -v tests.test_finalwave38_runtime_composition
      - name: Current-tree secret scan
        if: always()
        run: python tools/secret_scan.py --mode current
      - name: Full-history secret scan
        if: always()
        run: python tools/secret_scan.py --mode history
      - name: Recovery and no-autodeploy guards
        if: always()
        run: |
          test -f RECOVERY_BASELINE.md
          grep -q 'DO NOT MERGE / DO NOT DEPLOY' RECOVERY_BASELINE.md
          test ! -e .cpanel.yml
          test ! -e ops/ENABLE_HOSTIQ_AUTO_DEPLOY
          test "${{ github.head_ref || github.ref_name }}" != "main"
