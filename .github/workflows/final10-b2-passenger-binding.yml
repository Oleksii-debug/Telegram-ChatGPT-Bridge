name: FINAL10 B2 Passenger Binding

on:
  pull_request:
    paths:
      - 'bridge/runtime_wsgi.py'
      - 'ops/deployed_release_identity.py'
      - 'ops/passenger_bound_evidence.py'
      - 'ops/passenger_evidence_hook.py'
      - 'tests/test_final10_b2_passenger_binding.py'
      - 'tests/test_finalwave26_wsgi_guard_wiring.py'
      - '.github/workflows/final10-b2-passenger-binding.yml'

permissions:
  contents: read

jobs:
  passenger-binding:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Assert exact checked-out head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_HEAD"
          test "$(git rev-parse 'HEAD^{commit}')" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "FINAL10_B2_EXACT_HEAD=$EXPECTED_HEAD"
      - name: Compile B2 Passenger surfaces
        run: >-
          python -m py_compile
          bridge/runtime_wsgi.py
          ops/deployed_release_identity.py
          ops/passenger_bound_evidence.py
          ops/passenger_evidence_hook.py
          tests/test_final10_b2_passenger_binding.py
          tests/test_finalwave26_wsgi_guard_wiring.py
      - name: Run deployed-SHA binding and WSGI regressions
        run: |
          python -m unittest -v \
            tests.test_final10_b2_passenger_binding \
            tests.test_finalwave26_wsgi_guard_wiring
      - name: Current-tree secret scan
        if: always()
        run: python tools/secret_scan.py --mode current
      - name: Full-history secret scan
        if: always()
        run: python tools/secret_scan.py --mode history
      - name: Verify specialist cannot arm deployment
        if: always()
        run: |
          test ! -e .cpanel.yml
          test ! -e ops/ENABLE_HOSTIQ_AUTO_DEPLOY
          test "${{ github.event.pull_request.head.ref }}" != "main"
