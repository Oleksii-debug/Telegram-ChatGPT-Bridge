name: Recovery Guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Compile guard tooling
        run: python -m py_compile tools/secret_scan.py tests/test_secret_scan.py
      - name: Guard regression tests
        run: python -m unittest discover -s tests -v
      - name: Current-tree secret scan
        run: python tools/secret_scan.py --mode current
      - name: Full-history secret scan
        run: python tools/secret_scan.py --mode history
      - name: Verify recovery marker
        run: test -f RECOVERY_BASELINE.md && grep -q 'DO NOT MERGE / DO NOT DEPLOY' RECOVERY_BASELINE.md
